name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Run tests
        shell: bash
        run: |
          packages=$(find . -name '*.go' \
            -not -path './internal/*' \
            -not -path './hash/*' \
            -not -path './third_party/*' \
            -not -path '*/_asm/*' \
            -not -path '*/testdata/*' \
            -printf '%h\n' | sort -u)
          go test $packages
