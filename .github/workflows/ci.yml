name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Check formatting
        shell: bash
        run: |
          files=$(git ls-files '*.go' ':(exclude)internal/types/testdata/**' | xargs -r gofmt -l)
          if [[ -n "$files" ]]; then
            echo "These files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi

      - name: Run tests
        run: go test ./...
